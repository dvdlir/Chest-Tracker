name: Build Chest Tracker APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'chest_tracker_android_project.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q chest_tracker_android_project.zip
      - name: Fix Java and Kotlin versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("chest_tracker_android/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace(
              '    defaultConfig {',
              '''    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {'''
          )
          p.write_text(s)
          PY

      - name: Build APK
        working-directory: chest_tracker_android
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: chest-tracker-apk
          path: chest_tracker_android/app/build/outputs/apk/debug/app-debug.apk
